<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    뭔가 수정이 필요해,................


    <h2>Chapter 4 - Camera Live</h2>
    <p>가방과 스트랩이 잘 보이도록 프레임 안에 위치시켜 주세요.</p>

    <div>
        <video id="webcam" autoplay playsinline width="400" height="300" style="background:#000;"></video>
    </div>

    <br>

    <!-- 촬영 셔터 버튼 -->
    <button type="button" id="shutter-btn" style="padding: 10px 20px; font-weight: bold;">CAPTURE PHOTO</button>

    <!-- 에러 및 상태 메시지 출력 영역 -->
    <p id="error-message" style="color: red; font-weight: bold;"></p>
    <p id="success-message" style="color: green;"></p>

    <!-- 캡처를 위한 숨겨진 캔버스 -->
    <canvas id="snapshot-canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('webcam');
        const shutterBtn = document.getElementById('shutter-btn');
        const canvas = document.getElementById('snapshot-canvas');
        const errorMsg = document.getElementById('error-message');
        const successMsg = document.getElementById('success-message');

        // 1. 브라우저 웹캠 자동 실행
        async function startWebcam() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                video.srcObject = stream;
            } catch (err) {
                errorMsg.innerText = "E-06 / E-07: 카메라 권한이 없거나 실행할 수 없습니다.";
            }
        }

        // 2. 셔터 클릭 시 캔버스에 그리기 -> 백엔드로 전송 (품질 검사 수행)
        shutterBtn.addEventListener('click', async () => {
            errorMsg.innerText = "";
            successMsg.innerText = "";

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append('image', blob, 'capture.jpg');
                formData.append('shot_mode', 'FRONT_45');
                formData.append('selection_id', '{{ selection.id }}'); // 현재 selection ID

                try {
                    const response = await fetch('/api/ai_story/chapter4/capture/', {
                        method: 'POST',
                        body: formData,
                        headers: {
                            'X-CSRFToken': '{{ csrf_token }}'
                        }
                    });

                    const data = await response.json();

                    if (response.ok) {
                        successMsg.innerText = data.message + " 다음 단계로 이동합니다.";
                        // 성공 시 리다이렉트 처리 (예: C4-09 리뷰 화면 등)
                        console.log("Uploaded Photo Data:", data.data);
                    } else {
                        // 백엔드 유틸에서 반환한 에러 코드 및 메시지 출력 (E-08, E-09, E-10 등)
                        let code = data.error ? data.error.code : "ERROR";
                        let msg = data.error ? data.error.message : "알 수 없는 오류";
                        errorMsg.innerText = `[${code}] ${msg}`;
                    }
                } catch (err) {
                    errorMsg.innerText = "서버 통신 중 오류가 발생했습니다.";
                }
            }, 'image/jpeg');
        });

        startWebcam();
    </script>
</body>
</html>
