{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCM FROM ME - Review</title>
    <link rel="stylesheet" href="{% static 'css/common.css' %}" />
    <link rel="stylesheet" href="{% static 'css/chapter4.css' %}" />
</head>
<body data-menu-url="{% url 'hamburger_menu' %}" data-journey-active="true">
    <div class="app-container">
        <header class="common-header">
            <button
                type="button"
                class="menu-button"
                aria-label="메뉴 열기"
            >
            <img
                src="{% static 'images/hamburger_bar.svg' %}"
                alt="메뉴"
                aria-hidden="true"
            />
            </button>
            <h1>MCM FROM ME</h1>
        </header>
        

        <main class="page-content review-page">
            <div class="title-section">
                <h2 class="main-heading">Review your photo</h2>
                <p class="desc-en">Keep the styling and product clearly visible.</p>
            </div>

            <div class="review-card">
                <img src="{% static 'images/review_sample.png' %}" alt="Captured Photo" />

                <!-- 체크박스 배지 박스 -->
                <div class="check-badge-box">
                    <img src="{% static 'images/icon_check_circle.svg' %}" alt="체크" class="check-icon" />
                </div>
            </div>

            <!-- 하단 액션 영역 -->
            <div class="action-group">
                <a href="/api/ai_story/view/chapter5/discover/1/" class="btn-primary btn-gold" id="btnUsePhoto">
                    USE THIS PHOTO <img src="{% static 'images/arrow_icon.svg' %}" alt="화살표" />
                </a>
                <button type="button" class="btn-outline" id="btnRetake">
                    RETAKE
                </button>
            </div>
        </main>
    </div>
</body>
</html>
