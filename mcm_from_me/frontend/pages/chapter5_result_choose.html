{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCM FROM ME - Chapter 5 Result choose</title>
    <link rel="stylesheet" href="{% static 'css/common.css' %}" />
    <link rel="stylesheet" href="{% static 'css/chapter5.css' %}" />
</head>
<!--
    data-selection-id: /chapter5/complete/<selection_id>/ 호출에 사용
    data-card-id: /chapter5/share/<card_id>/ 호출에 사용
    data-product-id: /chapter5/product/<product_id>/ (VIEW DETAILS) 호출에 사용
    실제 뷰(chapter5_result_view)에서 context로 selection_id / card / card.product 등을 내려줘야 합니다.
    필드명이 다르면 아래 body 속성값만 맞춰주세요.
-->
<body
    data-selection-id="{{ selection_id|default:'' }}"
    data-card-id="{{ card.id|default:'' }}"
    data-product-id="{{ card.product.id|default:'' }}"
    data-menu-url="{% url 'hamburger_menu' %}" data-journey-active="true"
>
    <div class="app-container result-choose-container">
        <div class="result-choose-bg">
            <img 
                src="{% static 'images/story_card_img.png' %}" 
                alt="My MCM Story" 
                class="result-choose-img" 
                id="resultCardImg"
                onerror="this.onerror=null; this.src=`{% static 'images/story_card_img.png' %}`;"
            />
            <div class="result-choose-overlay"></div>
        </div>

        <main class="page-content result-choose-content">
            <!-- 상단 헤더 타이틀 -->
            <div class="result-choose-header">
                <span class="result-choose-label">YOUR JOURNEY</span>
                <h2 class="result-choose-title">NEW<br>HORIZON</h2>
            </div>

            <!-- 중앙 문구 -->
            <div class="result-choose-quote">
                <p>New roads. New stories.<br><em>Your journey continues.</em></p>
            </div>

            <!-- 하단 제품/키워드 태그 노출 영역 -->
            <div class="result-choose-keywords">
                <div class="keyword-item">
                    <span>ELLA BOSTON</span>
                    <span>BAG</span>
                </div>
                <span class="keyword-dot">•</span>
                <div class="keyword-item">
                    <span>NEW</span>
                    <span>JOURNEY</span>
                </div>
                <span class="keyword-dot">•</span>
                <div class="keyword-item">
                    <span>CROSSBODY</span>
                </div>
                <span class="keyword-dot">•</span>
                <div class="keyword-item">
                    <span>ROCKET</span>
                    <span>CHARM</span>
                </div>
            </div>

            <!-- 하단 주요 버튼 -->
            <div class="result-choose-actions">
                <button type="button" class="result-btn-outline" id="btnCompleteJourney">
                    COMPLETE MY JOURNEY
                </button>
            </div>

            <!-- 맨 하단 3개 아이콘 탭바 -->
            <footer class="result-bottom-bar">
                <button type="button" class="bottom-tab-btn" id="btnConnectAdviser">
                    <img src="{% static 'images/connect_adviser.svg' %}" alt="" class="tab-icon" />
                    <span>CONNECT<br>ADVISER</span>
                </button>

                <button type="button" class="bottom-tab-btn" id="btnShare">
                    <img src="{% static 'images/share.svg' %}" alt="" class="tab-icon" />
                    <span>SHARE</span>
                </button>

                <button type="button" class="bottom-tab-btn" id="btnViewDetails">
                    <img src="{% static 'images/view_details.svg' %}" alt="" class="tab-icon" />
                    <span>VIEW DETAILS</span>
                </button>
            </footer>
        </main>
    </div>

    <script src="{% static 'js/chapter5.js' %}"></script>
</body>
</html>
