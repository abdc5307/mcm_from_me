<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCM FROM ME - Chapter 5 Result choose</title>
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/chapter5.css" />
</head>
<body>
    <div class="app-container result-choose-container">
        <div class="result-choose-bg">
            <img src="../images/story_card_img.png" alt="NEW HORIZON" class="result-choose-img" />
            <div class="result-choose-overlay"></div>
        </div>

        <main class="page-content result-choose-content">
            <!-- 상단 헤더 타이틀 -->
            <div class="result-choose-header">
                <span class="result-choose-label">YOUR JOURNEY</span>
                <h2 class="result-choose-title">NEW<br>HORIZON</h2>
            </div>

            <!-- 중앙 문구 -->
            <div class="result-choose-quote">
                <p>New roads. New stories.<br><em>Your journey continues.</em></p>
            </div>

            <!-- 하단 제품/키워드 태그 노출 영역 -->
            <div class="result-choose-keywords">
                <div class="keyword-item">
                    <span>ELLA BOSTON</span>
                    <span>BAG</span>
                </div>
                <span class="keyword-dot">•</span>
                <div class="keyword-item">
                    <span>NEW</span>
                    <span>JOURNEY</span>
                </div>
                <span class="keyword-dot">•</span>
                <div class="keyword-item">
                    <span>CROSSBODY</span>
                </div>
                <span class="keyword-dot">•</span>
                <div class="keyword-item">
                    <span>ROCKET</span>
                    <span>CHARM</span>
                </div>
            </div>

            <!-- 하단 주요 버튼 -->
            <div class="result-choose-actions">
                <button type="button" class="result-btn-outline">
                    COMPLETE MY JOURNEY
                </button>
            </div>

            <!-- 맨 하단 3개 아이콘 탭바 -->
            <footer class="result-bottom-bar">
                <button type="button" class="bottom-tab-btn">
                    <img src="../images/connect_adviser.svg" alt="" class="tab-icon" />
                    <span>CONNECT<br>ADVISER</span>
                </button>

                <button type="button" class="bottom-tab-btn">
                    <img src="../images/share.svg" alt="" class="tab-icon" />
                    <span>SHARE</span>
                </button>

                <button type="button" class="bottom-tab-btn">
                    <img src="../images/view_details.svg" alt="" class="tab-icon" />
                    <span>VIEW DETAILS</span>
                </button>
            </footer>
        </main>
    </div>
</body>
</html>
