{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCM FROM ME - Camera Ready</title>
    <link rel="stylesheet" href="{% static 'css/common.css' %}" />
    <link rel="stylesheet" href="{% static 'css/chapter4.css' %}" />
</head>
<body data-menu-url="{% url 'hamburger_menu' %}" data-journey-active="true">
    <div class="app-container">
        <header class="common-header">
            <button
                type="button"
                class="menu-button"
                aria-label="메뉴 열기"
            >
            <img
                src="{% static 'images/hamburger_bar.svg' %}"
                alt="메뉴"
                aria-hidden="true"
            />
            </button>
            <h1>MCM FROM ME</h1>
        </header>

        <main class="page-content ready-page">
            <div class="title-section">
                <span class="chapter-tag">CHAPTER 4</span>
                <h2 class="main-heading">Capture your chapter</h2>
                
                <p class="desc-en">
                    Your styling is complete.<br>
                    Now capture your look and make it<br>
                    yours.
                </p>
                <p class="desc-ko">
                    스타일링이 완성되었습니다.<br>
                    이제 당신의 룩을 직접 담아보세요.
                </p>
            </div>

            <div class="divider"></div>

            <div class="image-card">
                <img src="{% static 'images/camera_ready_img.jpg' %}" alt="MCM Bag and Outfit" />
            </div>

            <div class="action-group">
                <button type="button" class="btn-primary btn-gold" id="btnOpenCamera">
                    <img src="{% static 'images/icon_camera_black.svg' %}" alt="카메라 아이콘" />
                    OPEN CAMERA
                </button>
            
                <a href="/chapter3/" class="btn-outline">
                    BACK TO STYLE
                </a>
            </div>

            <div class="divider"></div>

            <footer class="bottom-caption">
                A HERITAGE REIMAGINED FOR YOU
            </footer>
        </main>
    </div>
</body>
</html>
