<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCM FROM ME - Processing</title>
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/chapter5.css" />
</head>
<body>
    <div class="app-container processing-container">
        <main class="page-content processing-content">
            <!-- 상단 제목 -->
            <h2 class="processing-title">
                Completing<br>your journey...
            </h2>

            <!-- 카드 박스 -->
            <div class="progress-card">
                <div class="percentage-group">
                    <span>72%</span>
                </div>
                <p class="progress-label">JOURNEY IN PROGRESS</p>
            </div>

            <ul class="step-list">
                <li class="step-item">INTERPRETING YOUR MOMENT</li>
                <li class="step-item">READING YOUR PIECE</li>
                <li class="step-item">CONNECTING YOUR CHOICES</li>
                <li class="step-item active">WRITING YOUR JOURNEY</li>
            </ul>
            <p class="processing-footer-text">This may take a few moments.</p>
        </main>
    </div>
</body>
</html>
