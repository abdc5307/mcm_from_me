<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>MCM FROM ME - Journey Menu</title>
    <link rel="stylesheet" href="../css/hamburger_menu.css" />
  </head>

  <body>
    <main class="menu-page">
      <header class="menu-header">
        <h1>MCM FROM ME</h1>
      </header>

      <aside class="journey-menu" aria-label="Journey menu">
        <section class="home-section">
          <p class="section-label">HOME</p>
          <button type="button" class="home-link">Enter the Journey</button>
        </section>

        <section class="chapters-section">
          <p class="section-label">MEET YOUR PIECE</p>

          <ol class="chapter-list">
            <li class="chapter-item chapter-item--complete">
              <button type="button" class="chapter-link" data-chapter="1">
                <strong>CHAPTER 1</strong>
                <span>Choose Your Moment</span>
              </button>
            </li>

            <li class="chapter-item chapter-item--current" aria-current="step">
              <button type="button" class="chapter-link" data-chapter="2">
                <strong>CHAPTER 2</strong>
                <span>Meet Your Piece</span>
              </button>
            </li>

            <li class="chapter-item chapter-item--locked">
              <button type="button" class="chapter-link" data-chapter="3">
                <strong>CHAPTER 3</strong>
                <span>Shape your Story</span>
              </button>
            </li>

            <li class="chapter-item chapter-item--locked">
              <button type="button" class="chapter-link" data-chapter="4">
                <strong>CHAPTER 4</strong>
                <span>Capture your chapter</span>
              </button>
            </li>

            <li class="chapter-item chapter-item--locked">
              <button type="button" class="chapter-link" data-chapter="5">
                <strong>CHAPTER 5</strong>
                <span>My MCM Story Card</span>
              </button>
            </li>
          </ol>
        </section>

        <div class="menu-actions">
          <button type="button" class="resume-button">
            <img src="../images/diamond_light.svg" alt="" aria-hidden="true" />
            <span>RESUME JOURNEY</span>
          </button>
          <button type="button" class="advisor-link">Connect with Advisor</button>
        </div>
      </aside>
    </main>
  </body>
</html>
