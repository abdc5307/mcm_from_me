{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCM FROM ME - Still Deciding</title>
    <link rel="stylesheet" href="{% static 'css/common.css' %}" />
    <link rel="stylesheet" href="{% static 'css/chapter5.css' %}" />
    <link rel="stylesheet" href="{% static 'css/menu_toggle.css' %}" />
</head>
<body data-selection-id="{{ selection_id|default:'1' }}"
    data-menu-url="{% url 'hamburger_menu' %}" data-journey-active="true">

    <!-- Processing 로딩 화면 -->
    <div id="stillProcessingWrapper" style="display: none;">
        {% include 'chapter5_processing.html' %}
    </div>

    <div class="app-container still-container">
        <!-- 상단 헤더 -->
        <header class="common-header">
            <button
                type="button"
                class="menu-button"
                aria-label="메뉴 열기"
            >
            <img
                src="{% static 'images/hamburger_bar.svg' %}"
                alt="메뉴"
                aria-hidden="true"
            />
            </button>
            <h1>MCM FROM ME</h1>
        </header>

        <main class="still-content">
            <!-- 질문 타이틀 영역 -->
            <div class="still-title-group">
                <span class="still-label">CHAPTER 5</span>
                <h2 class="still-title">Tell Us One Thing</h2>
                <p class="still-subtext">What made you hesitate?</p>
            </div>

            <!-- 선택 리스트 -->
            <div class="still-option-list">
                <button type="button" class="still-option-btn" data-option="SIZE">
                    <img src="{% static 'images/icon_size.svg' %}" alt="size" class="option-img" />
                    <span>SIZE</span>
                </button>

                <button type="button" class="still-option-btn" data-option="WEIGHT">
                    <img src="{% static 'images/icon_weight.svg' %}" alt="weight" class="option-img" />
                    <span>WEIGHT</span>
                </button>

                <button type="button" class="still-option-btn" data-option="STORAGE">
                    <img src="{% static 'images/icon_storage.svg' %}" alt="storage" class="option-img" />
                    <span>STORAGE</span>
                </button>

                <button type="button" class="still-option-btn" data-option="COMFORT">
                    <img src="{% static 'images/icon_comfort.svg' %}" alt="comfort" class="option-img" />
                    <span>COMFORT</span>
                </button>

                <button type="button" class="still-option-btn" data-option="PRICE">
                    <img src="{% static 'images/icon_price.svg' %}" alt="price" class="option-img" />
                    <span>PRICE</span>
                </button>

                <button type="button" class="still-option-btn" data-option="DESIGN">
                    <img src="{% static 'images/icon_design.svg' %}" alt="design" class="option-img" />
                    <span>DESIGN</span>
                </button>
            </div>

            <!-- 하단 제출 영역 -->
            <div class="still-footer">
                <p class="still-footer-text">Answer helps AI personalize your journey</p>
                <button type="button" class="still-submit-btn" id="submitBtn">
                    SUBMIT TO AI
                </button>
            </div>
        </main>
    </div>

    <script src="{% static 'js/chapter5.js' %}"></script>
    <script src="{% static 'js/menu_toggle.js' %}"></script>
</body>
</html>
