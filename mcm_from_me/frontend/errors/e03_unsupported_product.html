<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MCM FROM ME - Unsupported Product</title>
    <link rel="stylesheet" href="../css/e03_unsupported_product.css" />
  </head>

  <body>
    <main class="error-page">
      <header class="error-header">
        <button type="button" class="menu-button" aria-label="메뉴 열기">
          <img src="../images/hamburger_bar.svg" alt="" aria-hidden="true" />
        </button>
        <h1>MCM FROM ME</h1>
      </header>

      <section class="unsupported-visual" aria-label="지원하지 않는 제품">
        <div class="orbit orbit--outer">
          <div class="orbit orbit--inner">
            <div class="product-icon">
              <img
                src="../images/bag_product.svg"
                alt="제품 가방"
              />
              <span class="unavailable-mark" aria-label="이용 불가">
                <img src="../images/x.svg" alt="" aria-hidden="true" />
              </span>
            </div>
          </div>
        </div>
      </section>

      <section class="error-message">
        <h2>
          This piece is not<br />
          available for this<br />
          journey.
        </h2>
        <p>
          해당 제품은 현재 체험 대상에 포함되<br />
          지 않습니다.
        </p>
      </section>

      <button type="button" class="scan-another-button">
        SCAN ANOTHER PIECE
      </button>
    </main>
  </body>
</html>
