<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MCM FROM ME — E-13</title>
  <link rel="stylesheet" href="../css/common.css" />
  <link rel="stylesheet" href="../css/e11_e13_journey_modal.css" />
</head>
<body>
  <div class="app-container">
    <div class="error-page modal-bg-page">
      
      <!-- Top Bar (배경용) -->
    <header class="common-header">
        <button type="button" class="menu-button" aria-label="메뉴 열기">
            <img src="../images/hamburger_bar.svg" alt="메뉴" aria-hidden="true" />
        </button>
        <h1>MCM FROM ME</h1>
    </header>

      <!-- Center Modal Card (E-13) -->
      <div class="session-center-modal">
        <div class="modal-card">
          <div class="modal-icon-circle">
            <svg viewBox="0 0 24 24" fill="none" stroke="#F2CA50" stroke-width="1.8">
              <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
            </svg>
          </div>

          <h2 class="modal-title-en">Start a new journey?</h2>
          <p class="modal-desc-kr">새로운 Journey를 시작하면 현재<br>선택 정보가 초기화됩니다.</p>

          <div class="modal-btn-stack">
            <button type="button" class="btn-e13-confirm">START NEW JOURNEY</button>
            <button type="button" class="btn-e13-cancel">CANCEL</button>
          </div>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
