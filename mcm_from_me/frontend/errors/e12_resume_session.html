<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MCM FROM ME — E-12</title>
  <link rel="stylesheet" href="../css/common.css" />
  <link rel="stylesheet" href="../css/e11_e13_journey_modal.css" />
</head>
<body>
  <div class="app-container">
    <div class="error-page modal-bg-page">
      
      <!-- Top Bar (배경용) -->
      <header class="common-header">
            <button type="button" class="menu-button" aria-label="메뉴 열기">
                <img src="../images/hamburger_bar.svg" alt="메뉴" aria-hidden="true" />
            </button>
            <h1>MCM FROM ME</h1>
        </header>

      <!-- Center Modal Card (E-12) -->
      <div class="session-center-modal">
        <div class="modal-card">
          <div class="modal-icon-circle">
            <svg viewBox="0 0 24 24" fill="none" stroke="#F2CA50" stroke-width="1.8">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
              <path d="M3 3v5h5"/>
              <polyline points="12 7 12 12 15 15"/>
            </svg>
          </div>

          <h2 class="modal-title-en">Would you like to<br>continue your<br>journey?</h2>
          <p class="modal-desc-kr">이전에 진행하던 Journey가 있습니다.</p>

          <div class="modal-btn-stack">
              <button type="button" class="btn-e12-continue">CONTINUE</button>
              <button type="button" class="btn-e12-startover">START OVER</button>
            </div>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
