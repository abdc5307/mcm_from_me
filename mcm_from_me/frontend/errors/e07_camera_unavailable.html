{% load static %}
<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MCM FROM ME - Camera Unavailable</title>
    <link rel="stylesheet" href="{% static 'css/e07_camera_unavailable.css' %}" />
  </head>

  <body>
    <main class="error-page">
      <header class="error-header">
        <button type="button" class="menu-button" aria-label="메뉴 열기" onclick="location.href='/hamburger-menu/'">
          <img src="{% static 'images/hamburger_bar.svg' %}" alt="" aria-hidden="true" />
        </button>
        <h1>MCM FROM ME</h1>
      </header>

      <section class="camera-visual" aria-label="카메라를 일시적으로 사용할 수 없음">
        <div class="camera-orbit camera-orbit--outer">
          <div class="camera-orbit camera-orbit--inner">
            <div class="camera-glow" aria-hidden="true"></div>
            <div class="camera-icon-box">
              <img class="camera-icon" src="{% static 'images/camera.svg' %}" alt="카메라" />
              <span class="warning-badge">
                <img src="{% static 'images/warning_triangle.svg' %}" alt="경고" />
              </span>
            </div>
          </div>
        </div>
      </section>

      <section class="error-message">
        <h2>
          The camera is<br />
          temporarily<br />
          unavailable.
        </h2>
        <p>
          카메라를 사용할 수 없습니다.<br />
          잠시 후 다시 시도해 주세요.
        </p>
      </section>

      <div class="error-actions">
        <button type="button" class="retry-button">RETRY</button>
        <button type="button" class="ask-staff-button">ASK STAFF</button>
      </div>
    </main>
  </body>
</html>
