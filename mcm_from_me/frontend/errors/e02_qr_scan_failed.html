{% load static %}
<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MCM FROM ME - QR Scan Failed</title>
    <link rel="stylesheet" href="{% static 'css/e02_qr_scan_failed.css' %}" />
  </head>

  <body>
    <main class="error-page">
      <header class="error-header">
        <button type="button" class="menu-button" aria-label="메뉴 열기">
          <img src="{% static 'images/hamburger_bar.svg' %}" alt="" aria-hidden="true" />
        </button>
        <h1>MCM FROM ME</h1>
      </header>

      <section class="scan-visual" aria-label="QR 코드 인식 실패">
        <img class="scan-frame" src="{% static 'images/QR Frame.svg' %}" alt="" aria-hidden="true" />
        <div class="scan-status">
          <img class="qr-icon" src="{% static 'images/QR_code.svg' %}" alt="QR 코드" />
          <img class="warning-icon" src="{% static 'images/warning_circle.svg' %}" alt="인식 실패" />
        </div>
      </section>

      <section class="error-message">
        <h2>We couldn’t recognize<br />this piece.</h2>
        <p>
          QR이 인식되지 않았습니다.<br />
          제품 태그에 다시 가까이 대어 주세요.
        </p>
      </section>

      <div class="error-actions">
        <button type="button" class="scan-again-button" data-retry-url="{% url 'tag_scan' %}">
          <img src="{% static 'images/refresh.svg' %}" alt="" aria-hidden="true" />
          <span>SCAN AGAIN</span>
        </button>
        <button type="button" class="ask-staff-button">
          <img src="{% static 'images/help_circle.svg' %}" alt="" aria-hidden="true" />
          <span>ASK STAFF</span>
        </button>
      </div>

      <div class="bottom-indicator" aria-hidden="true"></div>
    </main>
    <script src="{% static 'js/tag_error.js' %}" defer></script>
  </body>
</html>
