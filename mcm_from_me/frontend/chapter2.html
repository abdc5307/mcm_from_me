<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>MCM FROM ME - Chapter 2</title>
    <link rel="stylesheet" href="./css/chapter2.css" />
  </head>

  <body>
    <main class="chapter-page">
      <header class="chapter-header">
        <button
          type="button"
          class="menu-button"
          aria-label="메뉴 열기"
        >
          <img
            src="./images/hamburger_bar.svg"
            alt=""
            aria-hidden="true"
          />
        </button>

        <h1 class="brand-title">MCM FROM ME</h1>
      </header>

      <section class="chapter-intro">
        <p class="chapter-label">CHAPTER 2</p>
        <h2 class="piece-title">
          Your piece is <em>ELLA</em><br />
          <em>BOSTON BAG.</em>
        </h2>
      </section>

      <section class="piece-content">
        <img
          class="piece-image"
          src="./images/Small_Ella_Boston_Bag.jpg"
          alt="MCM Ella Boston Bag"
        />

        <article class="story-card">
          <p class="story-heading">
            <span class="gold-dot" aria-hidden="true"></span>
            A timeless shape for what comes next.
          </p>
          <p class="story-description">
            여행용 트렁크에서 이어진 구조가<br />
            새로운 시작을 위한 공간을 엽니다.
          </p>
        </article>
      </section>

      <div class="journey-badge">
        <span class="gold-dot" aria-hidden="true"></span>
        NEW JOURNEY × ELLA
      </div>

      <button type="button" class="wear-button">WEAR THE PIECE</button>
    </main>
  </body>
</html>
